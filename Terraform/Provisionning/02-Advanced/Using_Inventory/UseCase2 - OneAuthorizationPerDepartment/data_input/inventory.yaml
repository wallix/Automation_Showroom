# Inventory of UseCase2: one user group, one target group and one authorization per department.
# Keys (User_IT1, Windows_IT01, IT...) are Terraform keys: keep them stable, renaming one recreates its objects.

users_inventory:
  User_IT1:
    user_name: "User_IT1"
    display_name: "User_IT1"
    email: "user_it1@demo.com"
    profile: "product_administrator"
    user_auths: ["local_password", "local_sshkey"]
    force_change_pwd: true
    ssh_public_key: ""
  User_IT2:
    user_name: "User_IT2"
    display_name: "User_IT2"
    email: "user_it2@demo.com"
    profile: "product_administrator"
    user_auths: ["local_password", "local_sshkey"]
    force_change_pwd: true
    ssh_public_key: ""
  User_Dev1:
    user_name: "User_Dev1"
    display_name: "User_Dev1"
    email: "user_dev1@demo.com"
    profile: "user"
    user_auths: ["local_password", "local_sshkey"]
    force_change_pwd: true
    ssh_public_key: ""
  User_Dev2:
    user_name: "User_Dev2"
    display_name: "User_Dev2"
    email: "user_dev2@demo.com"
    profile: "user"
    user_auths: ["local_password", "local_sshkey"]
    force_change_pwd: true
    ssh_public_key: ""

# Departments: user group name => keys of users_inventory.
user_group_inventory:
  IT: [User_IT1, User_IT2]
  Dev: [User_Dev1, User_Dev2]

# account: shared account of the server, in its local domain "local".
# service: SSH (the account gets an SSH key generated by the Bastion) or RDP (a password).
vms_inventory:
  Windows_Common01:
    name: "Windows_Common01"
    ip: "192.168.1.10"
    account: "administrator"
    service: "RDP"
    port: 3389
  Windows_IT01:
    name: "Windows_IT01"
    ip: "192.168.1.11"
    account: "administrator"
    service: "RDP"
    port: 3389
  Windows_Dev01:
    name: "Windows_Dev01"
    ip: "192.168.1.12"
    account: "administrator"
    service: "RDP"
    port: 3389
  Linux_Common01:
    name: "Linux_Common01"
    ip: "192.168.1.13"
    account: "root"
    service: "SSH"
    port: 22

# Servers of each department: same names as user_group_inventory (the authorization links the two).
target_group_inventory:
  IT: [Windows_Common01, Windows_IT01, Linux_Common01]
  Dev: [Windows_Common01, Windows_Dev01, Linux_Common01]
