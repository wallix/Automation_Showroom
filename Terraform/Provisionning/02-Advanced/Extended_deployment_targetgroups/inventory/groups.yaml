# User groups. timeframes: names from timeframes.yaml, or the built-in "allthetime".
groups:
  developers:
    description: "Development team"
    timeframes: ["business_hours"]
  linux_admins:
    description: "Linux system administrators"
    timeframes: ["allthetime"]
  db_admins:
    description: "Database administrators"
    timeframes: ["extended_hours"]
  administrators:
    description: "System administrators"
    timeframes: ["allthetime"]
  network_team:
    description: "Network operations team"
    timeframes: ["business_hours"]
  auditors:
    description: "Security auditors"
    timeframes: ["business_hours"]
  emergency_access:
    description: "Break-glass access, on approval"
    timeframes: ["allthetime"]
