# One authorization links one user group to one target group.
# subprotocols: what the sessions may do; they must also be enabled on the services.
authorizations:
  developers_web_access:
    description: "Developers on the web servers"
    user_group: "developers"
    target_group: "web_servers"
    subprotocols: ["SSH_SHELL_SESSION", "SFTP_SESSION"]

  developers_app_access:
    description: "Developers on the application servers"
    user_group: "developers"
    target_group: "application_servers"
    subprotocols: ["SSH_SHELL_SESSION"]

  linux_admins_production:
    description: "Linux administrators on the production systems"
    user_group: "linux_admins"
    target_group: "production_systems"
    subprotocols: ["SSH_SHELL_SESSION", "SFTP_SESSION"]
    authorize_password_retrieval: true

  db_admins_database_access:
    description: "Database administrators on the database servers"
    user_group: "db_admins"
    target_group: "database_servers"
    subprotocols: ["SSH_SHELL_SESSION", "RAWTCPIP"]
    authorize_password_retrieval: true

  network_team_infrastructure:
    description: "Network team on the network equipment"
    user_group: "network_team"
    target_group: "network_equipment"
    subprotocols: ["SSH_SHELL_SESSION", "TELNET"]

  administrators_production:
    description: "Administrators on the production systems"
    user_group: "administrators"
    target_group: "production_systems"
    subprotocols: ["SSH_SHELL_SESSION", "SFTP_SESSION", "RAWTCPIP"]
    authorize_password_retrieval: true

  administrators_windows:
    description: "Administrators on the Windows servers"
    user_group: "administrators"
    target_group: "windows_infrastructure"
    subprotocols: ["RDP", "RAWTCPIP"]
    authorize_password_retrieval: true

  emergency_critical_access:
    description: "Emergency access to the critical infrastructure, on approval"
    user_group: "emergency_access"
    target_group: "critical_infrastructure"
    subprotocols: ["SSH_SHELL_SESSION", "RAWTCPIP", "TELNET"]
    authorize_password_retrieval: true
    approval_required: true
    approvers: ["administrators"]
    active_quorum: 2
    inactive_quorum: 1

  auditors_production:
    description: "Auditors on the production systems"
    user_group: "auditors"
    target_group: "production_systems"
    subprotocols: ["SSH_SHELL_SESSION"]

  auditors_network:
    description: "Auditors on the network equipment"
    user_group: "auditors"
    target_group: "network_equipment"
    subprotocols: ["SSH_SHELL_SESSION"]
