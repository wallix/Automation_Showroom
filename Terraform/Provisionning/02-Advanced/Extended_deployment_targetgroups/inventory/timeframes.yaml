# Periods during which the members of a user group can connect (Bastion time zone).
timeframes:
  business_hours:
    description: "Monday to Friday, 08:00 to 18:00"
    periods:
      - start_date: "2025-01-01"
        end_date: "2030-12-31"
        start_time: "08:00"
        end_time: "18:00"
        week_days: [monday, tuesday, wednesday, thursday, friday]

  extended_hours:
    description: "Monday to Friday 06:00 to 22:00, Saturday 08:00 to 18:00"
    periods:
      - start_date: "2025-01-01"
        end_date: "2030-12-31"
        start_time: "06:00"
        end_time: "22:00"
        week_days: [monday, tuesday, wednesday, thursday, friday]
      - start_date: "2025-01-01"
        end_date: "2030-12-31"
        start_time: "08:00"
        end_time: "18:00"
        week_days: [saturday]
