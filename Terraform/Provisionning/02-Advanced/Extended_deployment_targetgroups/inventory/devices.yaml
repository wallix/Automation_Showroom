# Servers and their services. connection_policy: a policy of connection_policies.yaml or a built-in one.
devices:
  - device_name: "web-server-01"
    host: "192.168.1.10"
    description: "Production web server"
    services:
      - id: "ssh"
        service_name: "SSH_Access"
        protocol: "SSH"
        port: 22
        connection_policy: "SSH_Developer"
        subprotocols: ["SSH_SHELL_SESSION"]
      - id: "sftp"
        service_name: "SFTP_Access"
        protocol: "SSH"
        port: 22
        connection_policy: "SSH_Developer"
        subprotocols: ["SFTP_SESSION"]

  - device_name: "db-server-01"
    host: "192.168.1.20"
    description: "Production database server"
    services:
      - id: "ssh"
        service_name: "SSH_Access"
        protocol: "SSH"
        port: 22
        connection_policy: "SSH_Admin"
        subprotocols: ["SSH_SHELL_SESSION"]
      - id: "mysql"
        service_name: "MySQL_Database"
        protocol: "RAWTCPIP"
        port: 3306
        connection_policy: "DB_Admin"

  - device_name: "win-server-01"
    host: "192.168.1.30"
    description: "Windows Server 2019"
    services:
      - id: "rdp"
        service_name: "Remote_Desktop"
        protocol: "RDP"
        port: 3389
        connection_policy: "RDP_Admin"
      - id: "winrm"
        service_name: "Windows_Remote_Management"
        protocol: "RAWTCPIP"
        port: 5985
        connection_policy: "WinRM_Management"

  - device_name: "switch-core-01"
    host: "192.168.1.100"
    description: "Core network switch"
    services:
      - id: "ssh"
        service_name: "SSH_Management"
        protocol: "SSH"
        port: 22
        connection_policy: "Network_Config"
        subprotocols: ["SSH_SHELL_SESSION"]
      - id: "telnet"
        service_name: "Telnet_Management"
        protocol: "TELNET"
        port: 23
        connection_policy: "TELNET_Management"

  - device_name: "app-server-01"
    host: "192.168.1.40"
    description: "Application server"
    services:
      - id: "ssh"
        service_name: "SSH_Access"
        protocol: "SSH"
        port: 22
        connection_policy: "SSH_Developer"
        subprotocols: ["SSH_SHELL_SESSION"]
