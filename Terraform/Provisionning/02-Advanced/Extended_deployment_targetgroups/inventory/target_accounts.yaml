# Accounts on the servers. services: ids of the device services the account is used on.
# target_groups: target groups the account is part of (session and password checkout).
# Passwords are generated by Terraform as placeholders: set the real ones on the Bastion.
target_accounts:
  web_admin:
    login: "webadmin"
    description: "Web server administrator"
    domain_name: "linux_domain"
    device_name: "web-server-01"
    services: ["ssh", "sftp"]
    target_groups: ["web_servers", "production_systems"]

  web_app:
    login: "webapp"
    description: "Web application service account"
    domain_name: "linux_domain"
    device_name: "web-server-01"
    services: ["ssh"]
    target_groups: ["web_servers"]

  app_admin:
    login: "appadmin"
    description: "Application server administrator"
    domain_name: "linux_domain"
    device_name: "app-server-01"
    services: ["ssh"]
    target_groups: ["application_servers", "production_systems"]

  app_service:
    login: "appservice"
    description: "Application service account"
    domain_name: "linux_domain"
    device_name: "app-server-01"
    services: ["ssh"]
    target_groups: ["application_servers"]

  db_admin:
    login: "dbadmin"
    description: "Database administrator"
    domain_name: "database_domain"
    device_name: "db-server-01"
    services: ["ssh", "mysql"]
    target_groups: ["database_servers", "production_systems", "critical_infrastructure"]

  mysql_root:
    login: "root"
    description: "MySQL root"
    domain_name: "database_domain"
    device_name: "db-server-01"
    services: ["mysql"]
    target_groups: ["database_servers", "critical_infrastructure"]

  win_admin:
    login: "Administrator"
    description: "Windows administrator"
    domain_name: "windows_domain"
    device_name: "win-server-01"
    services: ["rdp", "winrm"]
    target_groups: ["windows_infrastructure"]

  win_service:
    login: "ServiceAccount"
    description: "Windows service account"
    domain_name: "windows_domain"
    device_name: "win-server-01"
    services: ["winrm"]
    target_groups: ["windows_infrastructure"]

  switch_admin:
    login: "admin"
    description: "Network switch administrator"
    domain_name: "network_domain"
    device_name: "switch-core-01"
    services: ["ssh", "telnet"]
    target_groups: ["network_equipment", "critical_infrastructure"]

  switch_readonly:
    login: "readonly"
    description: "Network switch read-only account"
    domain_name: "network_domain"
    device_name: "switch-core-01"
    services: ["ssh"]
    target_groups: ["network_equipment"]
