# Custom connection policies. Each one copies the built-in policy of its protocol (SSH, RDP, TELNET, RAWTCPIP)
# and overrides the option sections listed in options.
connection_policies:
  ssh_admin:
    policy_name: "SSH_Admin"
    description: "SSH for administrators, 1 h inactivity timeout"
    protocol: "SSH"
    options:
      session:
        inactivity_timeout: 3600

  ssh_developer:
    policy_name: "SSH_Developer"
    description: "SSH for developers, 40 min inactivity timeout"
    protocol: "SSH"
    options:
      session:
        inactivity_timeout: 2400

  rdp_admin:
    policy_name: "RDP_Admin"
    description: "RDP for administrators, 1 h inactivity timeout"
    protocol: "RDP"
    options:
      session:
        inactivity_timeout: 3600

  network_config:
    policy_name: "Network_Config"
    description: "SSH to network equipment, 40 min inactivity timeout"
    protocol: "SSH"
    options:
      session:
        inactivity_timeout: 2400

  telnet_management:
    policy_name: "TELNET_Management"
    description: "TELNET to legacy network equipment"
    protocol: "TELNET"

  db_admin:
    policy_name: "DB_Admin"
    description: "Database access over TCP"
    protocol: "RAWTCPIP"

  winrm_management:
    policy_name: "WinRM_Management"
    description: "Windows Remote Management over TCP"
    protocol: "RAWTCPIP"
